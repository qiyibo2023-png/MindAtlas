<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MindAtlas — synthetic UX tests</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/mood/mood.css"><link rel="stylesheet" href="/assets/safety/safety.css"></head><body><div style="padding:12px;background:#edf1f5;color:#253d36"><strong>Synthetic test fixtures — not the application</strong> <label for="scenario">Test scenario</label> <select id="scenario"><option>none</option><option>incomplete</option><option>unable_to_assess</option><option>attention</option><option>elevated</option><option>acute_suicide</option><option>acute_medical</option><option>ocd_intrusive</option></select> <button id="lang" type="button">中文 / English</button></div><main id="main-content" tabindex="-1"></main><!-- SHARED SCRIPTS --><script>
let lang=1,view='safety';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G=GlobalSafety;
function choose(name){G.reset();G.store.region='ca';const s=G.empty();if(['none','attention'].includes(name))for(const p of G.critical)G.put(s,p,false);if(name==='attention')s.suicide.passiveDeathWish=true;if(name==='elevated')s.selfHarm.recentBehavior=true;if(name==='acute_suicide')s.suicide.intent=true;if(name==='acute_medical'){s.medical.suspectedOverdose=true;s.suicide.intent=true;}if(name==='ocd_intrusive')Object.assign(s.harmToOthers,{violentThoughts:true,thoughtsUnwanted:true,actualDesire:false,intent:false});G.acceptExtraction(name==='unable_to_assess'?'malformed JSON':{status:'partial',signals:s});render();}
function render(){const old=G.captureUI();document.documentElement.lang=lang?'en':'zh-CN';document.getElementById('main-content').innerHTML=G.panel(G.current());G.bind();G.restoreUI(old);}
function navigate(){render();}
document.getElementById('scenario').onchange=e=>choose(e.target.value);document.getElementById('lang').onclick=()=>{lang=1-lang;render();};choose('none');
</script></body></html>
